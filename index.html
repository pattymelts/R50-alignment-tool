<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],

                }

    <link rel="manifest" href="data:application/json;base64,eyJpY29ucyI6IFt7InNyYyI6ICJodHRwczovL3BsYWNlaG9sZC5jby8xOTJ4MTkyLzNiYjk2ZC8wMDAwMDA/dGV4dD1BTEkiLCAic2l6ZXMiOiAiMTkyeDE5MiIsICJ0eXBlIjogImltYWdlL3BuZyJ9LCB7InNyYyI6ICJodHRwczovL3BsYWNlaG9sZC5jby81MTJ4NTEyLzNiYjk2ZC8wMDAwMDA/dGV4dD1BTEkiLCAic2l6ZXMiOiAiNTEyeDUxMiIsICJ0eXBlIjogImltYWdlL3BuZyJ9XSwgIm5hbWUiOiAiUjUwIFByZWNpc2lvbiBBbGlnbmVyIiwgInNob3J0X25hbWUiOiAiUjUwIFRhcmdldCIsICJkaXNwbGF5IjogInN0YW5kYWxvbmUiLCAic3RhcnRfdXJsIjogIi4vIiwgImJhY2tncm91bmRfY29sb3IiOiAiIzE3MTcxNyIsICJ0aGVtZV9jb2xvciI6ICIjMzBiYjk2ZCJ9">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#30bb96">

    <style>
        body { font-family: 'Inter', sans-serif; }
        #videoElement {
            min-width: 100%;
            min-height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }
        .alignment-line {
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.9);
            transform-origin: 50% 50%; /* Center origin for rotation */
        }
        .target-line {
            box-shadow: 0 0 8px rgba(255, 255, 0, 0.7);
        }
        .calibration-point {
            position: absolute;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 50;
        }
    </style>
</head>
<body class="h-screen w-full bg-gray-900 flex flex-col overflow-hidden text-white p-0 m-0">

    <!-- Header -->
    <header class="p-3 bg-gray-800 shadow-lg z-10">
        <h1 class="text-xl font-bold text-center text-green-400">R50 Precision Targeting</h1>
        <div id="instructionText" class="text-sm text-center text-gray-400 mt-1">
            STEP 1: Tap the center of the **top** R50 sticker.
        </div>
    </header>

    <!-- Camera Viewport & Alignment Overlay -->
    <div id="cameraViewContainer" class="flex-grow relative bg-black flex items-center justify-center overflow-hidden" 
        ontouchstart="handleTouchStart(event)" 
        ontouchmove="handleTouchMove(event)" 
        ontouchend="handleTouchEnd(event)" 
        onclick="handleCalibrationClick(event)">
        
        <!-- Camera Feed (Video Element) -->
        <video id="videoElement" autoplay playsinline class="hidden"></video>

        <!-- Loading / Error States -->
        <div id="statusOverlay" class="absolute inset-0 flex flex-col items-center justify-center bg-gray-800/90 p-4">
            <svg id="spinner" class="animate-spin h-8 w-8 text-green-400 mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <p id="loadingMessage" class="text-gray-300">Initializing camera...</p>
            <button 
                id="retryButton" 
                onclick="startCamera()" 
                class="mt-4 px-4 py-2 bg-green-600 hover:bg-green-700 rounded-xl shadow-lg text-white font-semibold transition duration-200 hidden"
                >
                Try Camera Again
            </button>
        </div>
        
        <!-- Alignment Guide Overlay -->
        <div id="alignmentOverlay" class="absolute inset-0 hidden">
            <!-- Calibrated R50 Alignment Line (Red) -->
            <div id="redLine" class="absolute h-[200vh] w-0.5 bg-red-500 opacity-90 alignment-line hidden"></div>
            
            <!-- User Moveable Target Line (Yellow) -->
            <div id="yellowLine" class="absolute h-[200vh] w-0.5 bg-yellow-400 opacity-70 target-line hidden"></div>

            <!-- Calibration Points -->
            <div id="point1" class="calibration-point bg-white border-2 border-green-500 hidden"></div>
            <div id="point2" class="calibration-point bg-white border-2 border-green-500 hidden"></div>
        </div>
    </div>

    <!-- Footer / Controls -->
    <footer class="p-3 bg-gray-800 z-10 flex flex-col sm:flex-row justify-between items-center">
        <button 
            id="resetButton" 
            onclick="resetCalibration()" 
            class="w-full sm:w-auto px-4 py-2 bg-red-600 hover:bg-red-700 rounded-xl shadow-lg text-white font-semibold transition duration-200 hidden mb-2 sm:mb-0"
        >
            Recalibrate R50
        </button>
        <div class="text-xs text-center text-gray-500 mt-2 sm:mt-0">
            Drag **Yellow Line** to align target.
        </div>
    </footer>

    <script type="module">
        // --- Firebase Imports (MUST be at the top of a module script) ---
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        // --- Globals ---
        const videoElement = document.getElementById('videoElement');
        const statusOverlay = document.getElementById('statusOverlay');
        const alignmentOverlay = document.getElementById('alignmentOverlay');
        const instructionText = document.getElementById('instructionText');
        const redLine = document.getElementById('redLine');
        const yellowLine = document.getElementById('yellowLine');
        const resetButton = document.getElementById('resetButton');
        const cameraViewContainer = document.getElementById('cameraViewContainer');
        const point1 = document.getElementById('point1');
        const point2 = document.getElementById('point2');

        let calibrationPoints = [];
        let redLineAngle = 0;
        let isDraggingYellowLine = false;
        let dragStartX = 0;
        let yellowLineOffsetX = 0; // Relative horizontal offset from the center
        const maxOffset = 300; // Maximum allowed drag distance in pixels

        // --- Camera Initialization ---
        window.startCamera = async function() {
            statusOverlay.classList.remove('hidden');
            redLine.classList.add('hidden');
            yellowLine.classList.add('hidden');
            
            // Simplified constraints for max compatibility
            const constraints = { video: { facingMode: 'environment' } };

            try {
                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                videoElement.srcObject = stream;
                
                videoElement.play(); 
                
                videoElement.onplay = () => {
                    statusOverlay.classList.add('hidden');
                    videoElement.classList.remove('hidden');
                    alignmentOverlay.classList.remove('hidden');
                    resetButton.classList.remove('hidden');
                    console.log('Camera initialized successfully.');
                    videoElement.onplay = null;
                };
                
            } catch (err) {
                console.error("Camera access error:", err);
                document.getElementById('spinner').classList.add('hidden');
                document.getElementById('retryButton').classList.remove('hidden');
                
                const errMsg = err.name === 'NotAllowedError' ? 
                    'Permission denied. Check your phone settings.' : 
                    `Camera Error: ${err.name}. Try restarting.`; // FIXED: Removed escaping backslash
                document.getElementById('loadingMessage').textContent = errMsg;
            }
        }

        // --- Alignment and Targeting Logic ---

        /**
         * Step 1: Handle user clicks to define the alignment line.
         */
        window.handleCalibrationClick = function(event) {
            if (calibrationPoints.length >= 2) return; // Calibration complete

            // Get coordinates relative to the video container
            const rect = cameraViewContainer.getBoundingClientRect();
            const x = event.clientX - rect.left;
            const y = event.clientY - rect.top;

            calibrationPoints.push({ x, y });

            // Display the point marker
            const pointElement = calibrationPoints.length === 1 ? point1 : point2;
            pointElement.style.left = `${x}px`; // FIXED: Removed escaping backslash
            pointElement.style.top = `${y}px`; // FIXED: Removed escaping backslash
            pointElement.classList.remove('hidden');

            if (calibrationPoints.length === 1) {
                instructionText.textContent = "STEP 2: Tap the center of the **bottom** R50 sticker.";
            } else if (calibrationPoints.length === 2) {
                instructionText.textContent = "CALIBRATED! Drag the Yellow Line to aim at your target.";
                calculateAndDrawLines();
            }
        }

        /**
         * Step 2: Calculate the angle and rotation based on two points.
         */
        function calculateAndDrawLines() {
            if (calibrationPoints.length < 2) return;

            const p1 = calibrationPoints[0];
            const p2 = calibrationPoints[1];

            // 1. Calculate the angle of the line connecting P1 and P2
            const dx = p2.x - p1.x;
            const dy = p2.y - p1.y;
            // Angle in radians, converted to degrees
            redLineAngle = Math.atan2(dy, dx) * (180 / Math.PI) + 90; // +90 to make it vertical

            // 2. Calculate the center point for rotation and positioning
            const centerX = (p1.x + p2.x) / 2;
            const centerY = (p1.y + p2.y) / 2;

            // 3. Position and rotate the RED R50 Alignment Line
            redLine.style.left = `${centerX}px`; // FIXED: Removed escaping backslash
            redLine.style.top = '0'; // Use the center X for positioning
            redLine.style.transform = `translateX(-50%) rotate(${redLineAngle}deg)`; // FIXED: Removed escaping backslash
            redLine.classList.remove('hidden');

            // 4. Initialize the YELLOW Target Line (starts on top of the red line)
            yellowLineOffsetX = 0; // Reset offset
            updateYellowLinePosition();
            yellowLine.classList.remove('hidden');
        }

        /**
         * Step 3: Handle dragging the Yellow Line.
         */
        window.handleTouchStart = function(event) {
            // Only start drag if calibration is complete and there's only one touch (not pinch)
            if (calibrationPoints.length === 2 && event.touches.length === 1) {
                const touchX = event.touches[0].clientX;
                const rect = cameraViewContainer.getBoundingClientRect();
                
                // Check if the touch is near the yellow line (simple horizontal check)
                const yellowLineCenter = rect.left + rect.width / 2 + yellowLineOffsetX;
                if (Math.abs(touchX - yellowLineCenter) < 50) { // 50px tap target is easier on mobile
                    isDraggingYellowLine = true;
                    dragStartX = touchX - yellowLineOffsetX; // Store initial offset
                    event.preventDefault(); // Prevent scrolling while dragging
                }
            }
        }

        window.handleTouchMove = function(event) {
            if (isDraggingYellowLine && event.touches.length === 1) {
                const touchX = event.touches[0].clientX;
                const rect = cameraViewContainer.getBoundingClientRect();
                
                let newOffset = touchX - dragStartX;

                // Clamp the offset to prevent dragging too far off screen
                newOffset = Math.max(Math.min(newOffset, maxOffset), -maxOffset);

                yellowLineOffsetX = newOffset;
                updateYellowLinePosition();
                event.preventDefault();
            }
        }

        window.handleTouchEnd = function() {
            isDraggingYellowLine = false;
        }
        
        // Helper to update the Yellow Line position while keeping its angle parallel to Red
        function updateYellowLinePosition() {
            const centerX = cameraViewContainer.offsetWidth / 2;
            // We use the same rotation angle but apply a new horizontal offset (left)
            // The translateX(-50%) is to keep the line centered on its calculated left position.
            yellowLine.style.left = `${centerX + yellowLineOffsetX}px`; // FIXED: Removed escaping backslash
            yellowLine.style.transform = `translateX(-50%) rotate(${redLineAngle}deg)`; // FIXED: Removed escaping backslash
        }


        /**
         * Reset function.
         */
        window.resetCalibration = function() {
            calibrationPoints = [];
            redLineAngle = 0;
            yellowLineOffsetX = 0;
            isDraggingYellowLine = false;

            redLine.classList.add('hidden');
            yellowLine.classList.add('hidden');
            point1.classList.add('hidden');
            point2.classList.add('hidden');
            
            instructionText.textContent = "STEP 1: Tap the center of the **top** R50 sticker.";
            updateYellowLinePosition(); // Reset to center
        }

        // --- Firebase Imports/Setup (Required Environment Context) ---
        // (Authentication is handled but not used for data storage here)
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'r50-precision-targeting';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
        
        try {
            if (Object.keys(firebaseConfig).length > 0) {
                 const app = initializeApp(firebaseConfig);
                 const auth = getAuth(app);
                 async function authenticate() {
                     if (typeof __initial_auth_token !== 'undefined') {
                         await signInWithCustomToken(auth, __initial_auth_token);
                     } else {
                         await signInAnonymously(auth);
                     }
                 }
                 authenticate();
            }
        } catch (error) {
            console.error('Firebase Initialization Error:', error);
        }

        // --- Initialize on Load ---
        window.addEventListener('load', startCamera);
    </script>
</body>
</html>
